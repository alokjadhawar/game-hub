<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Game Hub</title><link rel="stylesheet" href="/styles.css"><style>main{padding-top:60px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0}.metric{padding:20px;background:#fff;border:1px solid var(--line);border-radius:14px}.metric b{font-size:30px;display:block}.metric span{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}@media(max-width:680px){.metrics{grid-template-columns:repeat(2,1fr)}table{font-size:12px}th,td{padding:9px}}</style></head><body><header><a class="brand" href="/">GAME<span>HUB</span></a><nav><a href="/">Player hub</a></nav></header><main><p class="eyebrow">REWARD CONTROL CENTER</p><h1 style="font-size:58px">Player analytics</h1><p id="message" class="muted">Checking secure access…</p><section id="content" hidden><div id="metrics" class="metrics"></div><h2 style="font-size:34px;margin:40px 0 15px">Players</h2><table><thead><tr><th>Player</th><th>Play time</th><th>Sessions</th><th>Days</th><th>Streak</th><th>Reward-ready</th></tr></thead><tbody id="players"></tbody></table></section></main><script src="/config.js"></script><script type="module" src="/admin.js"></script></body></html>
